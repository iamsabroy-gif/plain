# Publishes the browser playground (web/) and, under docs/, the documentation site to GitHub Pages
# whenever main changes.
# One-time setup by the repository owner: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: playground
on:
  push:
    branches: [main]
    paths: ["src/**", "lib/**", "web/**", "tools/**", "docs/**", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the WASI SDK
        run: |
          curl -fsSL -o sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          mkdir wasi-sdk && tar -xzf sdk.tar.gz -C wasi-sdk --strip-components=1
      - name: Build plain.wasm
        run: WASI_SDK="$PWD/wasi-sdk" sh tools/build-wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test it
        run: node tests/wasm_test.js
      - name: Build plain (the documentation reads the lessons and problems from it)
        run: make
      - name: Pack the site
        run: |
          mkdir site
          cp web/index.html web/worker.js web/syntax.js web/plain.wasm web/player.html site/
          node tools/build-docs.js site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
